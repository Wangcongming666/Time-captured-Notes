name: quality-and-integration
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: 03-源码/frontend/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build real MinIO test fixture from pinned official source
        run: docker build -t shiguang-minio-test:2025-10-15 -f 03-源码/backend/src/test/resources/minio/Dockerfile 03-源码/backend/src/test/resources/minio
      - name: Install real video processor
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Java domain architecture and real container tests
        run: mvn -B -ntp -f 03-源码/backend/pom.xml verify
      - name: Frontend tests and type-checked build
        working-directory: 03-源码/frontend
        run: |
          npm ci
          npm test
          npm run build
          npx playwright install --with-deps chromium
      - name: Start full local stack
        run: |
          python 03-源码/scripts/init-env.py
          docker compose --env-file 03-源码/.env -f 03-源码/docker-compose.yml up -d --build --wait --wait-timeout 240
      - name: Desktop and mobile browser tests
        working-directory: 03-源码/frontend
        run: |
          # This is the fresh CI-only Redis instance, never an external service.
          docker compose --env-file ../.env -f ../docker-compose.yml exec -T redis redis-cli FLUSHDB
          npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: verification-reports
          path: |
            03-源码/backend/target/surefire-reports
            03-源码/backend/target/failsafe-reports
            03-源码/backend/target/site/jacoco
            03-源码/frontend/test-results
      - name: Stop test stack
        if: always()
        run: |
          if [ -f 03-源码/.env ]; then
            docker compose --env-file 03-源码/.env -f 03-源码/docker-compose.yml down
          fi
