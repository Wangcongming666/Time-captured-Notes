server:
  port: 8080
  forward-headers-strategy: native
  tomcat:
    threads:
      max: 64
      min-spare: 8
spring:
  application:
    name: shiguang-notes
  profiles:
    default: dev
  flyway:
    enabled: true
  rabbitmq:
    virtual-host: shiguang
    publisher-confirm-type: correlated
    publisher-returns: true
    template:
      mandatory: true
    listener:
      simple:
        acknowledge-mode: manual
        prefetch: 20
  jackson:
    time-zone: UTC
mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  configuration:
    call-setters-on-nulls: true
    map-underscore-to-camel-case: true
management:
  server:
    port: 8081
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true
