openapi: 3.0.3
info:
  title: 拾光笔记 API 设计契约
  version: 1.0.0
  description: 实施契约：Java21模块化单体，时间UTC ISO8601，ID字符串；Cookie会话和同步CSRF。设计基线另保留于01-架构设计文档。
servers:
- url: http://localhost:8080
  description: 本地Docker Compose同源反向代理入口
paths:
  /api/v1/auth/csrf:
    get:
      operationId: op001
      summary: 获取CSRF令牌
      tags:
      - identity
      description: 需求：FR-01。角色：PUBLIC。服务端强制对象归属和状态校验；ADMIN不自动拥有REVIEWER权限。
      x-requirements:
      - FR-01
      x-roles:
      - PUBLIC
      parameters: []
      responses:
        '200':
          description: 成功；以本操作HTTP状态码为准
          content:
            application/json:
              schema:
                type: object
                required:
                - code
                - message
                - data
                - traceId
                properties:
                  code:
                    type: string
                    enum:
                    - OK
                  message:
                    type: string
                    description: ''
                  data:
                    $ref: '#/components/schemas/CsrfResult'
                  traceId:
                    type: string
                    description: ''
        '400':
          description: 参数错误
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: 未认证或会话撤销
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: 权限/CSRF/自审禁止
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: 不存在或不可见
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: 状态/版本冲突或幂等键异参
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '413':
          description: 文件/请求过大
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '415':
          description: 文件类型不支持
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          description: 限流
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: 依赖故障/积压保护
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
