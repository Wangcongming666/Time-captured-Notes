components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: SG_SESSION
  schemas:
    Error:
      type: object
      additionalProperties: false
      properties:
        code:
          type: string
          description: ''
        message:
          type: string
          description: ''
        traceId:
          type: string
          description: ''
        data:
          nullable: true
      required:
      - code
      - message
      - traceId
      - data
    Empty:
      type: object
      additionalProperties: false
      properties: {}
      required: []
    IdResult:
      type: object
      additionalProperties: false
      properties:
        id:
          type: string
          description: 数据库ID，十进制字符串
          pattern: ^[1-9][0-9]*$
      required:
      - id
    VersionResult:
      type: object
      additionalProperties: false
      properties:
        id:
          type: string
          description: 数据库ID，十进制字符串
          pattern: ^[1-9][0-9]*$
        version:
          type: integer
          description: ''
        status:
          type: string
          description: ''
      required:
      - id
      - version
      - status
    LoginRequest:
      type: object
      additionalProperties: false
      properties:
        username:
          type: string
          description: ''
          minLength: 4
          maxLength: 32
          pattern: ^[a-z0-9_]+$
        password:
          type: string
          description: ''
          minLength: 8
          maxLength: 72
      required:
      - username
      - password
    RegisterRequest:
      type: object
      additionalProperties: false
      properties:
        username:
          type: string
          description: ''
          minLength: 4
          maxLength: 32
          pattern: ^[a-z0-9_]+$
        password:
          type: string
          description: ''
          minLength: 8
          maxLength: 72
        nickname:
          type: string
          description: ''
          minLength: 1
          maxLength: 40
      required:
      - username
      - password
      - nickname
    CsrfResult:
      type: object
      additionalProperties: false
      properties:
        token:
          type: string
          description: 后续写请求放X-CSRF-TOKEN；登录后重新获取
      required:
      - token
    User:
      type: object
      additionalProperties: false
      properties:
        id:
          type: string
          description: 数据库ID，十进制字符串
          pattern: ^[1-9][0-9]*$
        nickname:
          type: string
          description: ''
        bio:
          type: string
          description: ''
        avatarMediaId:
          type: string
          description: 数据库ID，十进制字符串
          pattern: ^[1-9][0-9]*$
          nullable: true
        roles:
          type: array
          items:
            type: string
            enum:
            - USER
            - REVIEWER
            - ADMIN
        status:
          type: string
          enum:
          - ACTIVE
          - BANNED
        username:
          type: string
      required:
      - id
      - nickname
      - bio
      - avatarMediaId
      - roles
      - status
    ProfileRequest:
      type: object
      additionalProperties: false
      properties:
        nickname:
          type: string
          description: ''
          minLength: 1
          maxLength: 40
        bio:
          type: string
          description: ''
          maxLength: 300
        avatarMediaId:
          type: string
          description: 数据库ID，十进制字符串
          pattern: ^[1-9][0-9]*$
          nullable: true
      required:
      - nickname
      - bio
    AccountStatusRequest:
      type: object
      additionalProperties: false
      properties:
        status:
          type: string
          enum:
          - ACTIVE
          - BANNED
        reason:
          type: string
          description: ''
          minLength: 1
          maxLength: 500
      required:
      - status
      - reason
    RolesRequest:
      type: object
      additionalProperties: false
      properties:
        roles:
          type: array
          items:
            type: string
            enum:
            - USER
            - REVIEWER
            - ADMIN
          minItems: 1
          uniqueItems: true
        reason:
          type: string
          description: ''
          minLength: 1
          maxLength: 500
      required:
      - roles
      - reason
    Topic:
      type: object
      additionalProperties: false
      properties:
        id:
          type: string
          description: 数据库ID，十进制字符串
          pattern: ^[1-9][0-9]*$
        name:
          type: string
          description: ''
        category:
          type: string
          description: ''
        status:
          type: string
          enum:
          - ACTIVE
          - DISABLED
      required:
      - id
      - name
      - category
      - status
    TopicRequest:
      type: object
      additionalProperties: false
      properties:
        name:
          type: string
          description: ''
          minLength: 1
          maxLength: 40
        category:
          type: string
          description: ''
